name: edufeedback

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:4101:4100"
    environment:
      DATABASE_URL: postgresql://attainline:local-development-only@database:5432/attainline
      DEMO_ORGANISATION_ID: 11111111-1111-4111-8111-111111111111
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: attainline
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: attainline
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attainline -d attainline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
