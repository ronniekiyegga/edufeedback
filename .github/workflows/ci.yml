name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: attainline
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: attainline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U attainline -d attainline_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter @attainline/web lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @attainline/api test

      - name: Apply test database migrations
        run: pnpm --filter @attainline/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://attainline:local-development-only@127.0.0.1:5432/attainline_test

      - name: Test student database queries
        run: pnpm --filter @attainline/api test:integration
        env:
          DATABASE_URL: postgresql://attainline:local-development-only@127.0.0.1:5432/attainline_test

      - name: Build applications
        run: pnpm build
